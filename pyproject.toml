[project]
name = "fastgear"
version = "0.9.0"
description = "A personal utility library I've developed to streamline and optimize backend development with FastAPI in my projects. From generic repositories and queries to enums, error handling, and more, FastGear encompasses essential tools that have proven invaluable in my development journey, whether as a novice or a seasoned professional."
authors = [
    {name = "Henrique Marcuzzo <henrique.souza.m06@gmail.com>"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.13",
    "fastapi-pagination>=0.13.2",
    "loguru>=0.7.3",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.0",
    "typing-inspect>=0.9.0",
]

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy>=2.0.41",
    "sqlalchemy-utils>=0.41.2",
    "uuid6>=2025.0.0",
]

redis = [
    "redis>=6.2.0",
]

all = [
    "fastgear[sqlalchemy]",
    "fastgear[redis]",
]


[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    # ----------------------------------------
    # Code quality
    # ----------------------------------------
    "pre-commit>=4.2.0",
    "python-semantic-release>=10.4.1",
    "ruff>=0.12.0",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.12",
]

test = [
    "faker>=37.4.0",
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-testdox>=3.1.0",
]

# ==== ruff ====
[tool.ruff]
fix = true
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "_build",
    "buck-out",
    "build",
    "dist",
]

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
extend-select = ["I"]
ignore = [
    "A005",    # Module shadows a Python builtin; allowed intentionally (e.g. `types.py`)
    "COM812",  # Missing trailing comma; conflicts with the Ruff formatter
    "C901",    # Function too complex (McCabe); complexity limit not enforced in this project
    "DTZ005",  # `datetime.now()` without `tz`; timezone handled at a higher layer
    "E501",    # Line too long; delegated to the formatter (line-length already configured)
    "FIX002",  # Line contains TODO; pending-work comments are allowed
    "F811",    # Redefinition of unused import; needed in fixtures and re-exports
    "G004",    # Logging with f-string; accepted for readability
    "PLC0415", # `import` outside module level; required for conditional imports
    "PERF203", # `try/except` inside loop; overhead is acceptable in the contexts used
    "PGH003",  # `type: ignore` without specific rule code; blanket suppressions allowed
    "N818",    # Exception without `Error` suffix; project follows its own naming convention
    "SLF001",  # Private member accessed; necessary in tests and internal utilities
    "ARG",     # Unused arguments; common in callbacks, handlers, and interface implementations
    "ANN",     # Missing type annotations; full typing is not enforced across the codebase
    "B",       # flake8-bugbear; optional rules disabled to reduce noise
    "D",       # pydocstyle; docstring format not enforced by the linter
    "EM",      # String literals directly in exceptions; accepted for simplicity
    "RUF",     # Ruff-specific rules; disabled to avoid future conflicts
    "PLR",     # Pylint refactor suggestions
    "S",       # flake8-bandit (security); frequent false positives in internal code
    "TD",      # TODO formatting rules
    "TRY",     # tryceratops; try/except patterns are not enforced
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "F401",    # Unused import; fixtures are imported via conftest without direct reference
    "PLR2004", # Magic value in comparison; acceptable in test assertions
    "PT006",   # Wrong type for first argument of `pytest.mark.parametrize`
    "N806",    # Uppercase variable in function; used for class references in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "8.0.0"
addopts = "-ra -q --force-testdox --cov=fastgear --cov-branch --cov-report=html"
testpaths = ["tests/"]

# ==== Semantic Release ====
[tool.semantic_release]
commit_message = """\
🔖 Release version {version}

Automatically generated by python-semantic-release
"""
tag_format = "{version}"
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = ["fastgear/__init__.py:__version__"]
vcs_release = true
build_command = "uv lock && git add uv.lock"
