fix = true
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "_build",
    "buck-out",
    "build",
    "dist",
]

[lint]
fixable = ["ALL"]
select = ["ALL"]
extend-select = ["I"]
ignore = [
    "A005",    # Module shadows a Python builtin; allowed intentionally (e.g. `types.py`)
    "COM812",  # Missing trailing comma; conflicts with the Ruff formatter
    "C901",    # Function too complex (McCabe); complexity limit not enforced in this project
    "DTZ005",  # `datetime.now()` without `tz`; timezone handled at a higher layer
    "E501",    # Line too long; delegated to the formatter (line-length already configured)
    "FIX002",  # Line contains TODO; pending-work comments are allowed
    "F811",    # Redefinition of unused import; needed in fixtures and re-exports
    "G004",    # Logging with f-string; accepted for readability
    "PLC0415", # `import` outside module level; required for conditional imports
    "PERF203", # `try/except` inside loop; overhead is acceptable in the contexts used
    "PGH003",  # `type: ignore` without specific rule code; blanket suppressions allowed
    "N818",    # Exception without `Error` suffix; project follows its own naming convention
    "SLF001",  # Private member accessed; necessary in tests and internal utilities
    "ARG",     # Unused arguments; common in callbacks, handlers, and interface implementations
    "ANN",     # Missing type annotations; full typing is not enforced across the codebase
    "B",       # flake8-bugbear; optional rules disabled to reduce noise
    "D",       # pydocstyle; docstring format not enforced by the linter
    "EM",      # String literals directly in exceptions; accepted for simplicity
    "RUF",     # Ruff-specific rules; disabled to avoid future conflicts
    "PLR",     # Pylint refactor suggestions
    "S",       # flake8-bandit (security); frequent false positives in internal code
    "TD",      # TODO formatting rules
    "TRY",     # tryceratops; try/except patterns are not enforced
]

[lint.per-file-ignores]
"tests/**.py" = [
    "F401",    # Unused import; fixtures are imported via conftest without direct reference
    "PLR2004", # Magic value in comparison; acceptable in test assertions
    "PT006",   # Wrong type for first argument of `pytest.mark.parametrize`
    "N806",    # Uppercase variable in function; used for class references in tests
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
